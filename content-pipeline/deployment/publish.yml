name: Publish and check Yueqian

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 22 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: yueqian-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check content and failure protection
        run: node --test content-pipeline/*.test.mjs
      - name: Build and verify approved materials
        run: |
          node content-pipeline/run.mjs build
          node content-pipeline/run.mjs check
          node native-app/scripts/export-content-release.mjs --check
          node native-app/scripts/test-content-release.mjs
          node native-app/scripts/test-external-materials.mjs
      - name: Check native catalog and teaching kit match the Web source
        run: |
          node native-app/scripts/export-content.mjs --check
          node native-app/scripts/verify-content-kit.mjs
      - name: Refresh source discovery, falling back to the published catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: node content-pipeline/discover-ci.mjs --fallback https://tsd619124.github.io/yueqian-training/content-discovery.json
      - name: Build static search index, reusing unchanged documents
        run: node content-pipeline/search-index.mjs --previous https://tsd619124.github.io/yueqian-training/content-library/
      - name: Prepare site and retain previous valid content and index
        run: node content-pipeline/production.mjs output/site https://tsd619124.github.io/yueqian-training/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: output/site
          retention-days: 1
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify public release and search index (retries propagation lag)
        run: node content-pipeline/verify-production.mjs https://tsd619124.github.io/yueqian-training/ output/site output/previous-release-manifest.json
