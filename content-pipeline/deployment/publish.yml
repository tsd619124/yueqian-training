name: Publish and check Yueqian

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 22 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: yueqian-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.repository.private == false
    # 固定运行器版本：ubuntu-latest 将迁移到 26，届时需验证后再升级。
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Run the shared release check list (tests, build, cross-client consistency)
        run: node content-pipeline/release.mjs check --ci
      - name: Refresh source discovery, falling back to the published catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: node content-pipeline/discover-ci.mjs --fallback https://tsd619124.github.io/yueqian-training/content-discovery.json
      - name: Build static search index, reusing unchanged documents
        run: node content-pipeline/search-index.mjs --previous https://tsd619124.github.io/yueqian-training/content-library/
      - name: Prepare site and retain previous valid content and index
        run: node content-pipeline/production.mjs output/site https://tsd619124.github.io/yueqian-training/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: output/site
          retention-days: 1
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify public release and search index (retries propagation lag)
        run: node content-pipeline/verify-production.mjs https://tsd619124.github.io/yueqian-training/ output/site output/previous-release-manifest.json
